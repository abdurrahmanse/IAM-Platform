version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: iam_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d iam_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/iam_db
      - REDIS_URL=redis://redis:6379/0

  website:
    build:
      context: .
      dockerfile: ./apps/website/Dockerfile
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000

  admin:
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000

  portal:
    build:
      context: .
      dockerfile: ./apps/portal/Dockerfile
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - website
      - admin
      - portal
      - api

volumes:
  postgres_data:
